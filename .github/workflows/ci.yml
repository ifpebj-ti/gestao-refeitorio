name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --runInBand


  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean verify


  # ============================================================
  # VALIDAÇÃO DOS DOCKERFILES
  # ============================================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    strategy:
      matrix:
        include:
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: gestao-refeitorio-${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
