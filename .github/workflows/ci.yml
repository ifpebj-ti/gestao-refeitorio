name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / install and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=critical
      - run: npm run build

  backend:
    name: Backend / tests and package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  repository-security:
    name: Security / repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Vulnerabilities, secrets and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker:
    name: Docker / ${{ matrix.app }}
    runs-on: ubuntu-24.04
    needs: [frontend, backend, repository-security]
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: gestao-refeitorio-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gestao-refeitorio-${{ matrix.app }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
