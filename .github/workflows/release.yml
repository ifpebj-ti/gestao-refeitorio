name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  # ============================================================
  # VALIDAÇÃO DA VERSÃO
  # ============================================================

  validate-version:
    name: Validate SemVer
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Validate SemVer tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer version: $VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH"
            echo "Example: 0.2.0"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"


  # ============================================================
  # BUILD E PUBLICAÇÃO NO GHCR
  # ============================================================

  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-latest

    needs:
      - validate-version

    strategy:
      matrix:
        include:
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}

          tags: |
            type=raw,value=${{ needs.validate-version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image for security scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ needs.validate-version.outputs.version }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ needs.validate-version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - validate-version
      - publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes
