name: CI / Security / Release

on:
  pull_request:
    branches: [main, develop]

  push:
    branches: [main, develop]

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    name: Frontend / lint and build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx --yes eslint@9.39.5 . --config ../.github/eslint.config.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build

  # =========================================================
  # BACKEND
  # =========================================================
  backend:
    name: Backend / tests and build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and build
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================
  # SECURITY
  # =========================================================
  security:
    name: Security / SAST and dependencies
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

      - name: SAST / Semgrep
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep:1.158.0
          semgrep scan --config p/default --error
          --exclude frontend/node_modules
          --exclude backend/target
          /src

  # =========================================================
  # DOCKER IMAGES
  # =========================================================
  images:
    name: Images / build, analyze and publish
    needs: [frontend, backend, security]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.revision.outputs.short_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
        with:
          persist-credentials: false

      - id: revision
        name: Resolve revision
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # =====================================================
      # BUILD LOCAL PARA SCAN
      # =====================================================

      - name: Build frontend image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gestao-refeitorio-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gestao-refeitorio-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # =====================================================
      # TRIVY
      # =====================================================

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true

      - name: Trivy / repository and images
        run: |
          set +e
          scan_status=0

          run_trivy() {
            local label="$1"
            shift

            local output
            local result
            local findings
            local details

            output="$("$@" 2>&1)"
            result=$?

            printf '%s\n' "$output"

            if [ "$result" -ne 0 ]; then
              findings="$(printf '%s\n' "$output" | grep -oE '(CVE|AVD)-[A-Za-z0-9-]+' | sort -u | paste -sd ',' -)"
              details="$(printf '%s\n' "$output" | tail -n 8 | tr '\r\n' ' ' | cut -c1-800)"

              echo "::error title=Trivy / ${label}::${findings:-${details:-scan failed; see the job log}}"

              scan_status=1
            fi
          }

          # Maven POM inheritance can make the filesystem scanner report versions
          # from unrelated properties. Scan repository configuration and secrets
          # here; resolved backend dependencies are inspected in the built image.

          run_trivy repository \
            trivy fs \
            --offline-scan \
            --skip-dirs .git \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

          run_trivy "frontend image" \
            trivy image \
            --ignorefile .trivyignore.yaml \
            --show-suppressed \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            gestao-refeitorio-frontend:ci

          run_trivy "backend image" \
            trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            gestao-refeitorio-backend:ci

          exit "$scan_status"

      # =====================================================
      # GHCR LOGIN
      # =====================================================

      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # TAGS
      # =====================================================

      - id: image-tags
        name: Define image tags
        env:
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}

        run: |
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"

            tags="$image:sha-$SHORT_SHA"

            if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
              tags="$tags"$'\n'"$image:dev-$SHORT_SHA"$'\n'"$image:dev"
            fi

            {
              echo "${app}<<EOF"
              printf '%s\n' "$tags"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      # =====================================================
      # BUILD + PUBLISH AMD64
      # =====================================================

      - name: Build and publish frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0d
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64

          push: >-
            ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
            && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}

          tags: ${{ steps.image-tags.outputs.frontend }}

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and publish backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64

          push: >-
            ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
            && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}

          tags: ${{ steps.image-tags.outputs.backend }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # =========================================================
  # RELEASE PLEASE
  # =========================================================
  release:
    name: Release / calculate version

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    needs: images
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main

  # =========================================================
  # PUBLICAR RELEASE
  # =========================================================
  publish-release:
    name: Release / publish images

    if: needs.release.outputs.created == 'true'

    needs: [images, release]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f 
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 
      - name: Promote image tags
        env:
          SHORT_SHA: ${{ needs.images.outputs.short_sha }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}

        run: |
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"

            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:$RELEASE_TAG" \
              --tag "$image:latest" \
              "$image:sha-$SHORT_SHA"
          done

  # =========================================================
  # DEPLOY PRODUCTION
  # =========================================================
  deploy-production:
    name: Release / deploy production

    if: needs.release.outputs.created == 'true'

    needs:
      - release
      - publish-release

    runs-on: ubuntu-24.04

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload Compose definitions
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}

        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            docker-compose.prod.yml \
            "$USER@$HOST:/opt/gestao-refeitorio/"

      - name: Deploy with health check and rollback
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_TAG: ${{ needs.release.outputs.version }}

        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "bash -s -- '$IMAGE_TAG' docker-compose.prod.yml" \
            < scripts/deploy-remote.sh
