name: CI / Security / Release

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  frontend:
    name: Frontend / lint and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        # ESLint 10 ainda não é compatível com os plugins React do Next 16.
        run: npx --yes eslint@9.39.5 . --config ../.github/eslint.config.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Dependency audit
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build

  backend:
    name: Backend / tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and build
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security / SAST and dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
      - name: SAST / Semgrep
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep:1.158.0
          semgrep scan --config p/default --error
          --exclude frontend/node_modules
          --exclude backend/target
          /src

  images:
    name: Images / build, analyze and publish
    needs: [frontend, backend, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: revision
        name: Resolve revision
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: gestao-refeitorio-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: gestao-refeitorio-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true
      - name: Trivy / repository and images
        run: |
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 gestao-refeitorio-frontend:ci
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 gestao-refeitorio-backend:ci
      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish analyzed images
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        env:
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          for app in frontend backend; do
            local_image="gestao-refeitorio-${app}:ci"
            remote_image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"
            docker tag "$local_image" "$remote_image:sha-$SHORT_SHA"
            docker push "$remote_image:sha-$SHORT_SHA"
            if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
              docker tag "$local_image" "$remote_image:dev-$SHORT_SHA"
              docker tag "$local_image" "$remote_image:dev"
              docker push "$remote_image:dev-$SHORT_SHA"
              docker push "$remote_image:dev"
            fi
          done

  release:
    name: Release / calculate version
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main

  publish-release:
    name: Release / publish images
    if: needs.release.outputs.created == 'true'
    needs: [images, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote analyzed images
        env:
          SHORT_SHA: ${{ needs.images.outputs.short_sha }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"
            docker pull "$image:sha-$SHORT_SHA"
            docker tag "$image:sha-$SHORT_SHA" "$image:$VERSION"
            docker tag "$image:sha-$SHORT_SHA" "$image:$RELEASE_TAG"
            docker tag "$image:sha-$SHORT_SHA" "$image:latest"
            docker push "$image:$VERSION"
            docker push "$image:$RELEASE_TAG"
            docker push "$image:latest"
          done

  deploy-production:
    name: Release / deploy production
    if: needs.release.outputs.created == 'true'
    needs: [release, publish-release]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload Compose definitions
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml docker-compose.prod.yml \
            "$USER@$HOST:/opt/gestao-refeitorio/"
      - name: Deploy with health check and rollback
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_TAG: ${{ needs.release.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "bash -s -- '$IMAGE_TAG' docker-compose.prod.yml" < scripts/deploy-remote.sh
