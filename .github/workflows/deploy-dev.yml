name: Build and Deploy DEV

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # BUILD E PUBLICAÇÃO DAS IMAGENS
  # ============================================================

  build:
    name: Build and Publish ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:dev
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:dev-${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY NA VM OCI
  # ============================================================

  deploy:
    name: Deploy DEV
    runs-on: ubuntu-latest

    needs:
      - build

    environment:
      name: dev

    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key

      - name: Adicionar servidor ao known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy na VM
        run: |
          ssh \
            -i ~/.ssh/dev_key \
            ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'

            cd /opt/gestao-refeitorio

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.dev.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.dev.yml \
              up -d

            docker image prune -f

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.dev.yml \
              ps

          EOF
