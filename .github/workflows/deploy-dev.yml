name: Deploy Development

on:
  workflow_run:
    workflows: [CI / Security / Release]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  context:
    name: Resolve revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then SHA="$WORKFLOW_SHA"; else SHA="$DISPATCH_SHA"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy development
    needs: context
    runs-on: ubuntu-24.04
    environment:
      name: development
      url: ${{ vars.DEVELOPMENT_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload Compose definitions
        env:
          HOST: ${{ secrets.DEV_HOST }}
          USER: ${{ secrets.DEV_USER }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml docker-compose.dev.yml \
            "$USER@$HOST:/opt/gestao-refeitorio/"
      - name: Deploy with health check and rollback
        env:
          HOST: ${{ secrets.DEV_HOST }}
          USER: ${{ secrets.DEV_USER }}
          IMAGE_TAG: dev-${{ needs.context.outputs.short_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "bash -s -- '$IMAGE_TAG' docker-compose.dev.yml" < scripts/deploy-remote.sh
