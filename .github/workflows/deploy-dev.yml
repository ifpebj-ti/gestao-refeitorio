name: Deploy Development

on:
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-development
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  context:
    name: Resolve revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then SHA="$WORKFLOW_SHA"; else SHA="$DISPATCH_SHA"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:12}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish development / ${{ matrix.app }}
    needs: context
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:dev-${{ needs.context.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:dev
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Security gate before publish
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:dev-${{ needs.context.outputs.short_sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push verified tags
        run: docker image push --all-tags "${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.app }}"

  deploy:
    name: Deploy development
    needs: [context, publish]
    runs-on: ubuntu-24.04
    environment:
      name: development
      url: ${{ vars.DEVELOPMENT_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload Compose definitions
        env:
          HOST: ${{ secrets.DEV_HOST }}
          USER: ${{ secrets.DEV_USER }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml docker-compose.dev.yml \
            "$USER@$HOST:/opt/gestao-refeitorio/"
      - name: Deploy with health check and rollback
        env:
          HOST: ${{ secrets.DEV_HOST }}
          USER: ${{ secrets.DEV_USER }}
          IMAGE_TAG: dev-${{ needs.context.outputs.short_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "bash -s -- '$IMAGE_TAG' docker-compose.dev.yml" < scripts/deploy-remote.sh
