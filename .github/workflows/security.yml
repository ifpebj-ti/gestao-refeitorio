name: Security

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical


  # ============================================================
  # SCAN DO REPOSITÓRIO
  # ============================================================

  filesystem-scan:
    name: Repository Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # ============================================================
  # SCAN DAS IMAGENS
  # ============================================================

  image-scan:
    name: Scan ${{ matrix.app }} Image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: gestao-refeitorio-${{ matrix.app }}:security

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gestao-refeitorio-${{ matrix.app }}:security
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
