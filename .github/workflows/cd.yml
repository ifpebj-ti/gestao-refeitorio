name: CD / Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: SHA completo da main já aprovado por CI e Security (vazio usa HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-release-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    name: CD / Verify approved revision
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: revision
        name: Resolve and validate main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$REQUESTED_SHA" ]]; then
            source_sha="$REQUESTED_SHA"
          else
            source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          fi

          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "SHA de origem inválido: $source_sha" >&2
            exit 1
          }
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$source_sha" == "$main_sha" ]] || {
            echo "Somente o HEAD atual da main pode ser promovido: source=$source_sha main=$main_sha" >&2
            exit 1
          }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the same SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-workflow.sh ci.yml "${{ steps.revision.outputs.source_sha }}" push

      - name: Require successful Security for the same SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-workflow.sh security.yml "${{ steps.revision.outputs.source_sha }}" push

  release:
    name: CD / Calculate release
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main

  publish-release:
    name: CD / Publish signed release
    if: needs.release.outputs.created == 'true'
    needs: [gate, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Verify Security signatures and promote image tags
        env:
          SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/security.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"
            digest="$(docker buildx imagetools inspect "$image:sha-$SHORT_SHA" |
              awk '$1 == "Digest:" && !found { print $2; found=1 }')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Digest inválido para $image:sha-$SHORT_SHA" >&2
              exit 1
            }
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image@$digest" >/dev/null
            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:$RELEASE_TAG" \
              --tag "$image:latest" \
              "$image@$digest"
          done

      - name: Sign release images and generate SBOMs
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}"
            digest="$(docker buildx imagetools inspect "$image:$VERSION" |
              awk '$1 == "Digest:" && !found { print $2; found=1 }')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Digest inválido para $image:$VERSION" >&2
              exit 1
            }
            image_ref="$image@$digest"
            sbom="sbom-${app}-${VERSION}.spdx.json"
            cosign sign --yes "$image_ref"
            trivy image --quiet --format spdx-json --output "$sbom" "$image_ref"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$image_ref"
          done

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: sbom-${{ needs.release.outputs.version }}
          path: sbom-*.spdx.json
          if-no-files-found: error

      - name: Attach SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG" sbom-*.spdx.json
          --repo "$GITHUB_REPOSITORY" --clobber

  deploy-production:
    name: CD / Deploy production
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.created == 'true' &&
      needs.publish-release.result == 'success'
    needs: [gate, release, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          persist-credentials: false

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify signed release images
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for app in frontend backend; do
            image="${REGISTRY}/${GITHUB_REPOSITORY}-${app}:${RELEASE_VERSION}"
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image" >/dev/null
          done

      - name: Resolve deploy image tag
        id: deploy-tag
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          [[ -n "$RELEASE_VERSION" ]] || {
            echo "A versão da release não foi informada pelo Release Please." >&2
            exit 1
          }
          echo "tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploy usando release assinada: $RELEASE_VERSION"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload Compose definitions
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            docker-compose.prod.yml \
            docker-compose.observabilidade.yml \
            scripts/backup-postgres.sh \
            scripts/deploy-remote.sh \
            "$USER@$HOST:/opt/gestao-refeitorio/"
          scp -r -i ~/.ssh/deploy_key infra/nginx \
            "$USER@$HOST:/opt/gestao-refeitorio/"

      - name: Deploy with health check and rollback
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_TAG: ${{ steps.deploy-tag.outputs.tag }}
        run: >-
          ssh -i ~/.ssh/deploy_key "$USER@$HOST"
          "bash /opt/gestao-refeitorio/deploy-remote.sh '$IMAGE_TAG' docker-compose.prod.yml"

      - name: Run production security smoke tests
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          REPORT_FILE: ${{ runner.temp }}/production-security-smoke-report.txt
        run: bash scripts/tests/production-security-smoke-test.sh "$PRODUCTION_URL" "$REPORT_FILE"

      - name: Upload production security smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: production-security-smoke-report
          path: ${{ runner.temp }}/production-security-smoke-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Trigger post-deploy DAST in Security
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run security.yml --ref main -f run_dast=true
