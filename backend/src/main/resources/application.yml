spring:
  application:
    name: estoque-cozinha
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque_cozinha}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate # schema é controlado pelo Flyway, não pelo Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Limite próprio (5MB) validado em MovimentacaoFotoServiceImpl; isso só evita que o
      # Spring rejeite antes mesmo de chegar no controller (default do Boot é 1MB).
      max-file-size: 5MB
      max-request-size: 5MB

security:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-chars}
    expiration-ms: 86400000 # 24h

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
