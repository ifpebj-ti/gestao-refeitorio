spring:
  application:
    name: estoque-cozinha
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque_cozinha}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate # schema é controlado pelo Flyway, não pelo Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  servlet:
    multipart:
      # Limite próprio (5MB) validado em MovimentacaoFotoServiceImpl; isso só evita que o
      # Spring rejeite antes mesmo de chegar no controller (default do Boot é 1MB).
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    # Padrão localhost só pra o JavaMailSender existir sem SMTP configurado; o envio falha
    # com EnvioEmailException, mas a aplicação sobe normalmente.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

security:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-chars}
    expiration-ms: 86400000 # 24h para nutricionista e admin
    expiration-cozinha-ms: 259200000 # 72h (3 dias) para perfil COZINHA

app:
  # Origem(ns) do frontend aceitas no CORS, separadas por vírgula.
  url-frontend: ${APP_URL_FRONTEND:http://localhost:3000,https://gestao-refeitorio-ifpe.duckdns.org}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:411051502805-kktsu5dn98f504upsj8jlh1qmroq9k48.apps.googleusercontent.com}

email:
  remetente: ${MAIL_FROM:nao-responda@localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # SMTP fora do ar deixaria o /actuator/health DOWN e o deploy faria rollback.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
