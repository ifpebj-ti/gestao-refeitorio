# Regras locais complementares ao OWASP CRS.
#
# O CRS já inspeciona ARGS, REQUEST_URI e REQUEST_HEADERS. Estas regras tornam
# explícitos os vetores observados pela aplicação e bloqueiam variações
# codificadas antes do roteamento. IDs 11000-11999 são reservados ao projeto.

# Traversal em segmentos do path, incluindo codificação simples e dupla.
SecRule REQUEST_URI "@rx (?i)(?:[.][.]|%2e%2e|%252e%252e)(?:/|%2f|%252f|%5c|%255c)" \
    "id:11001,phase:1,deny,status:403,log,msg:'Path traversal bloqueado na borda',severity:'CRITICAL',tag:'gestao/path-traversal'"

# Query strings são avaliadas separadamente para impedir bypass por parâmetros.
SecRule QUERY_STRING "@rx (?i)(?:[.][.]|%2e%2e|%252e%252e)(?:/|%2f|%252f|%5c|%255c)" \
    "id:11002,phase:1,deny,status:403,log,msg:'Query traversal bloqueado na borda',severity:'CRITICAL',tag:'gestao/query-traversal'"

# Authorization e X-XSRF-TOKEN são os headers customizados relevantes usados
# pelo frontend. Essas regras bloqueiam sem registrar o valor do header.
SecRule REQUEST_HEADERS:Authorization|REQUEST_HEADERS:X-XSRF-TOKEN "@rx (?i)(?:<[[:space:]]*script|union(?:/[*].*?[*]/|[[:space:]])+select|(?:^|[[:space:]])or(?:/[*].*?[*]/|[[:space:]])+1[[:space:]]*=[[:space:]]*1|%0d|%0a)" \
    "id:11003,phase:1,pass,nolog,setvar:tx.gestao_header_attack=1"

# Rejeita tentativa de injeção de quebra de linha codificada em qualquer
# header. A política é bloquear sem persistir o conteúdo potencialmente sensível.
SecRule REQUEST_HEADERS "@rx (?i)(?:%0d|%0a)" \
    "id:11004,phase:1,pass,nolog,setvar:tx.gestao_header_attack=1"

# O bloqueio ocorre sobre um marcador booleano, e não sobre o header. Assim o
# error log registra a evidência e a severidade sem copiar o valor sensível.
SecRule TX:gestao_header_attack "@eq 1" \
    "id:11005,phase:1,deny,status:403,log,msg:'Payload malicioso bloqueado em header',severity:'CRITICAL',tag:'gestao/custom-header'"
