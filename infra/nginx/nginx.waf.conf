server_tokens off;

limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_local:10m rate=5r/m;

limit_req_status 429;

server {
    listen 8080;
    listen [::]:8080;

    server_name gestao-refeitorio-ifpe.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    server_name gestao-refeitorio-ifpe.duckdns.org;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com;" always;

    ssl_certificate /etc/letsencrypt/live/gestao-refeitorio-ifpe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestao-refeitorio-ifpe.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 6m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 60s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    set $frontend http://frontend:3000;
    set $backend  http://backend:8080;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/auth/local {
        limit_req zone=auth_local burst=4 nodelay;

        # Public reverse-proxy endpoint by design; marking it internal would
        # make the authentication route unreachable by clients.
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Public reverse-proxy endpoint by design; marking it internal would
        # make the API unreachable by clients.
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;

        # Public reverse-proxy endpoint by design; marking it internal would
        # make the frontend unreachable by clients.
        proxy_pass $frontend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/x-component;
        sub_filter 'http://localhost:8080/api' '/api';
    }
}
