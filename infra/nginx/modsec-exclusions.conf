# Exceções restritas aos campos de credencial necessários aos fluxos de autenticação.
# Não desabilitam o OWASP CRS para a rota inteira.
SecRule REQUEST_FILENAME "@streq /api/auth/google" \
    "id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.idToken"

SecRule REQUEST_FILENAME "@streq /api/auth/local" \
    "id:10002,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.senha"

SecRule REQUEST_FILENAME "@rx ^/api/usuarios/[^/]+/senha$" \
    "id:10003,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.senha"
