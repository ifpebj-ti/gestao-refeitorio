# Uso explícito, NÃO é carregado sozinho:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production