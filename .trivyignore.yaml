vulnerabilities:
  - id: CVE-2026-102276
    statement: >-
      Transitive dependency bundled by the official node:26-alpine image (brace-expansion). npm is
      used only to launch next start; crafted brace patterns are not processed.
    expired_at: 2026-11-30
  - id: CVE-2026-102278
    statement: >-
      Transitive dependency bundled by the official node:26-alpine image (brace-expansion). npm is
      used only to launch next start; crafted brace patterns are not processed.
    expired_at: 2026-11-30
  - id: CVE-2026-19534
    statement: >-
      Transitive dependency bundled by the official node:26-alpine image (undici). npm is
      used only as a process launcher and does not handle WebSocket traffic.
    expired_at: 2026-11-30
  - id: CVE-2026-111755
    statement: >-
      Transitive dependency follow-redirects. The application does not follow untrusted cross-origin
      redirects with regex-based sensitive headers.
    expired_at: 2026-11-30
  - id: CVE-2026-111756
    statement: >-
      Transitive dependency follow-redirects. The application does not send array-form sensitive headers
      over cross-origin redirects.
    expired_at: 2026-11-30
  - id: CVE-2026-93749
    statement: >-
      Transitive dependency of postcss/next.js (source-map-js). Source maps are
      used only during build/compilation and not exposed to untrusted external input.
    expired_at: 2026-11-30
  - id: CVE-2026-94483
    statement: >-
      Next.js Image Optimization SSRF (fixed in 16.3.8). The application does not
      configure or use remotePatterns for image fetching; static assets only.
    expired_at: 2026-11-30
  - id: CVE-2026-77214
    statement: >-
      Heap buffer over-read in libexpat bundled in base container image. The service
      does not process untrusted XML input.
    expired_at: 2026-11-30
