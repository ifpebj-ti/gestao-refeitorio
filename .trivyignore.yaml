vulnerabilities:
  - id: CVE-2026-111497
    statement: >-
      Google Brotli buffer overflow in base container image. The frontend serves static
      Next.js assets and does not decompress untrusted external Brotli streams.
    expired_at: 2026-11-30
  - id: CVE-2026-109869
    statement: >-
      Transitive dependency bundled in node image (undici). Build-time launcher only;
      does not handle external stream connections.
    expired_at: 2026-11-30
  - id: CVE-2026-102276
    statement: >-
      Transitive dependency bundled in node image (brace-expansion). Build-time tool only;
      crafted brace patterns are not processed.
    expired_at: 2026-11-30
  - id: CVE-2026-102278
    statement: >-
      Transitive dependency bundled in node image (brace-expansion). Build-time tool only;
      crafted brace patterns are not processed.
    expired_at: 2026-11-30
